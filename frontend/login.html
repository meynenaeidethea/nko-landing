<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Карта добрых дел</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">

  <div class="card p-4 shadow-sm" style="width:380px;">
    <h4 class="mb-3">Вход</h4>
    <input id="auth-email" class="form-control mb-2" placeholder="Email" type="email"/>
    <input id="auth-password" class="form-control mb-3" placeholder="Пароль" type="password"/>
    <div class="d-grid">
      <button id="auth-submit" class="btn btn-primary">Войти</button>
    </div>
    <div class="mt-3 text-center">
      <a href="register.html">Регистрация</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('auth-submit').onclick = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  if(!email || !password){ alert('Введите email и пароль'); return; }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if(res.ok){ 
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      alert('Вход успешен'); 
      window.location.href = 'index.html'; 
    }
    else alert(data.error || 'Ошибка входа');
  } catch(e){ alert('Не удалось связаться с сервером'); }
};
</script>
</body>
</html>
