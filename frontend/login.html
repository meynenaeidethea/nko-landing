<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Карта добрых дел</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center ms-3" href="index.html">
      <img src="assets/logo_rosatom_hor_white.png" alt="logo" class="logo-img">
    </a>
    <span class="mapKind title-center-page">Карта добрых дел</span>
  </div>
</nav>

<div class="d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 70px);">
  <div class="card p-4 shadow-sm" style="width:380px;">
    <h4 class="mb-3">Вход</h4>
    <input id="auth-email" class="form-control mb-2" placeholder="Email" type="email"/>
    <input id="auth-password" class="form-control mb-3" placeholder="Пароль" type="password"/>
    <div class="d-grid">
      <button id="auth-submit" class="btn btn-primary">Войти</button>
    </div>
    <div class="mt-3 text-center">
      <a href="register.html">Регистрация</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('auth-submit').onclick = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  if(!email || !password){ alert('Введите email и пароль'); return; }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if(res.ok){ 
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
  
  // Проверяем параметр redirect в URL
  const urlParams = new URLSearchParams(window.location.search);
  const redirect = urlParams.get('redirect');
  
  if (redirect) {
    window.location.href = redirect;
  } else if (data.user && data.user.is_admin) {
    // Если пользователь админ - перенаправляем в админку
    alert('Вход успешен (Администратор)'); 
    window.location.href = 'admin.html'; 
  } else {
    alert('Вход успешен'); 
    window.location.href = 'index.html'; 
  }
  }
    else alert(data.error || 'Ошибка входа');
  } catch(e){ alert('Не удалось связаться с сервером'); }
};
</script>
</body>
</html>
