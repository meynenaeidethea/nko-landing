<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карта добрых дел</title>
  <meta name="description" content="Интерактивная карта НКО и волонтерских инициатив" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="map.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="assets/logo_rosatom_hor_white.png" alt="logo" class="logo-img">
      <span class="mapKind">Карта добрых дел</span>
    </a>

    <div class="d-flex align-items-center">
      <button id="btn-login" class="btn btn-outline-light me-2" style="display: none;">Войти</button>
      <button id="btn-add" class="btn btn-light text-primary me-2" style="display: none;">Добавить НКО</button>
      <button id="btn-admin" class="btn btn-outline-warning me-2" style="display: none;">Админка</button>
      <button id="btn-logout" class="btn btn-outline-light" style="display: none;">Выйти</button>
    </div>
  </div>
</nav>

<div class="container content-wrapper">
  <div class="row g-3 full-height">
    <aside class="col-lg-4">
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h5 class="card-title mb-3">Поиск и фильтры</h5>

          <label class="form-label small">Поиск</label>
          <div class="input-group mb-3">
            <input id="search" class="form-control" placeholder="Найти НКО по названию" />
            <button class="btn btn-primary" id="search-btn">Искать</button>
          </div>

          <label class="form-label small">Город</label>
          <select id="city-select" class="form-select mb-3">
            <option value="">Все города</option>
          </select>

          <label class="form-label small">Категории</label>
          <div id="category-list" class="d-flex flex-wrap gap-2 mb-3"></div>

          <div class="d-grid gap-2">
            <button id="btn-reset" class="btn btn-outline-secondary">Сброс</button>
            <button id="btn-show-list" class="btn btn-outline-primary">Показать список</button>
          </div>
        </div>
      </div>

      <!-- выпадающий список нко, надо доделать -->
      <!-- 
      <div id="nko-list" class="list-group" aria-live="polite">  
      </div> 
      -->
      
    </aside>

    <main class="col-lg-8">
      <div class="card shadow-sm">
        <div id="map" style="width: 100%; height: 100%;"></div>
        <script src="https://api-maps.yandex.ru/2.1/?apikey=ваш API-ключ&lang=ru_RU"
        type="text/javascript">
        </script>
        <script src="map.js"></script> <!-- подключаем карту -->
      </div>
    </main>
  </div>
</div>


<div class="modal fade" id="orgModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="modal-title" class="modal-title">Название</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-8">
            <p id="modal-desc" class="text-muted"></p>
            <p><strong>Телефон:</strong> <span id="modal-phone">—</span></p>
            <p><strong>Адрес:</strong> <span id="modal-address">—</span></p>
            <p><a id="modal-site" href="#" target="_blank">Сайт / соцсеть</a></p>
          </div>
          <div class="col-md-4 text-center">
            <img id="modal-img" src="" alt="Логотип" class="img-fluid rounded" style="max-height:160px;">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-edit" class="btn btn-outline-secondary">Редактировать</button>
        <button class="btn btn-primary" data-bs-dismiss="modal">Закрыть</button>
      </div>
    </div>
  </div>
</div>


<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить организацию</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="add-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Название</label>
              <input id="add-name" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Категория</label>
              <input id="add-cat" class="form-control" required />
            </div>
            <div class="col-12">
              <label class="form-label">Краткое описание</label>
              <textarea id="add-desc" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Телефон</label>
              <input id="add-phone" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Город</label>
              <select id="add-city" class="form-select"></select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="add-cancel" type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button id="add-submit" type="button" class="btn btn-primary">Отправить на модерацию</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- <script src="app.js"></script> -->
<script src="map.js"></script>
</body>
</html>
