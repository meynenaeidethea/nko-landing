<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">Админ-панель</a>
      <a class="btn btn-outline-light" href="index.html">Назад</a>
    </div>
  </nav>

  <div class="container my-4">
    <h4>Заявки на модерацию</h4>
    <div id="pending-list" class="mt-3"></div>
  </div>

<script>
async function loadPending(){
  try {
    const res = await fetch('/api/admin/pending');
    const list = await res.json();
    const box = document.getElementById('pending-list');
    if(!list.length){ box.innerHTML = '<div class="alert alert-info">Нет новых заявок</div>'; return; }
    box.innerHTML = '';
    list.forEach(o => {
      const el = document.createElement('div');
      el.className = 'card mb-2 p-2';
      el.innerHTML = `<b>${o.name}</b><div class="text-muted">${o.city}</div>
        <div class="mt-2">
          <button class="btn btn-success btn-sm me-2" onclick="approve(${o.id})">Одобрить</button>
          <button class="btn btn-danger btn-sm" onclick="reject(${o.id})">Отклонить</button>
        </div>`;
      box.appendChild(el);
    });
  } catch(e){ document.getElementById('pending-list').innerHTML = '<div class="alert alert-warning">Не удалось загрузить данные</div>'; }
}
async function approve(id){
  await fetch(`/api/admin/approve/${id}`, {method:'POST'});
  loadPending();
}
async function reject(id){
  await fetch(`/api/admin/reject/${id}`, {method:'POST'});
  loadPending();
}
loadPending();
</script>
</body>
</html>
